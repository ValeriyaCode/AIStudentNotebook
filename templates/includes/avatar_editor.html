    <div class="avatar-editor">
        <div class="avatar-circle">
            <img class="avatar-preview" {% if user.avatar %}src="{{ user.avatar.url }}"{% else %}hidden{% endif %} alt="Моя аватарка">
            <svg class="avatar-placeholder" {% if user.avatar %}hidden{% endif %} viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="35" r="17" fill="currentColor"/><path d="M18 88c0-24 14-35 32-35s32 11 32 35" fill="currentColor"/></svg>
        </div>
        <label class="avatar-add" for="avatar-upload" aria-label="Змінити аватарку">+</label>
        <input id="avatar-upload" class="avatar-input" type="file" name="avatar" accept="image/jpeg,image/png,image/webp">
        <span class="avatar-hint">Обрати фото</span>
        <span class="avatar-status" role="status"></span>
    </div>
