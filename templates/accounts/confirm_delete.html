{% extends 'base.html' %}{% block content %}<section class="field-card"><h1>Видалити «{{ target }}»?</h1><p>{% if kind == 'group' %}Група, акаунти її учнів і всі їхні відповіді будуть видалені остаточно.{% else %}Акаунт учня та всі його відповіді будуть видалені остаточно.{% endif %}</p><form method="post">{% csrf_token %}<input type="hidden" name="action" value="delete"><input type="hidden" name="confirm" value="yes"><button class="button danger">Так, видалити</button> <a class="button ghost" href="{% url 'group_detail' group.pk %}">Скасувати</a></form></section>{% endblock %}
