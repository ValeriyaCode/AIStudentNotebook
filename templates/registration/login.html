{% extends 'base.html' %}
{% block title %}Вхід{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="eyebrow">Твоя особиста навчальна тетрадь</div>
    <h1>Увійти</h1>
    <form method="post" class="stack">{% csrf_token %}{{ form.as_p }}<button class="button primary">Увійти</button></form>
    <p class="muted">Ще немає акаунта? <a href="{% url 'register' %}">Зареєструватися</a></p>
</div>
{% endblock %}
